name: linklab_flutter_sdk
description: >-
  Flutter plugin for Linklab dynamic links: Android App Links / iOS universal
  links, deferred deep links (Play Install Referrer, pasteboard, IP attribution)
  and short-link resolution.
version: 0.3.0
homepage: https://linklab.cc
repository: https://github.com/Linklab-cc/linklab-flutter-sdk
issue_tracker: https://github.com/Linklab-cc/linklab-flutter-sdk/issues
topics:
  - deep-linking
  - deferred-deep-link
  - dynamic-links
  - universal-links
  - app-links

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: cc.linklab.flutter
        pluginClass: LinkLabFlutterPlugin
      ios:
        pluginClass: LinkLabFlutterPlugin
